name: TestFlight

# Builds a signed release and uploads it to TestFlight.
# Run manually from the Actions tab ("Run workflow") when you want a new build.
#
# Requires four repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID      App Store Connect API key ID (e.g. ABC123DE45)
#   ASC_ISSUER_ID   App Store Connect API issuer ID (a UUID)
#   ASC_PRIVATE_KEY Full contents of the AuthKey_XXXX.p8 file, incl. BEGIN/END lines
#   ASC_TEAM_ID     Your Apple Developer Team ID (10 chars, from developer.apple.com Membership)

on:
  workflow_dispatch:

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          cat > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 <<'EOF'
          ${{ secrets.ASC_PRIVATE_KEY }}
          EOF

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project CapabilityFlow.xcodeproj \
            -scheme CapabilityFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CapabilityFlow.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.ASC_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CapabilityFlow.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/CapabilityFlow.ipa" \
            -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
