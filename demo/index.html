<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#33505a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Capability Flow — Demo</title>
<style>
  :root{
    --accent:#33505a; --accent2:#5a7d80;
    --bg:#f2f2f7; --card:#ffffff; --card2:#fbfbfd;
    --text:#1c1c1e; --text2:#6c6c70; --text3:#a0a0a6;
    --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12);
    --lead:#345c4d; --support:#456680; --inform:#8c804d; --receive:#727278;
    --warn:#b5651d;
    --tabbar:rgba(249,249,251,.92);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --accent:#5a8087; --accent2:#6e9398;
      --bg:#000000; --card:#1c1c1e; --card2:#161618;
      --text:#ffffff; --text2:#9b9ba0; --text3:#6c6c70;
      --sep:rgba(84,84,88,.5); --fill:rgba(120,120,128,.2);
      --lead:#5a937c; --support:#6e93b8; --inform:#b5a76b; --receive:#9a9aa0;
      --warn:#d68a3f;
      --tabbar:rgba(22,22,24,.9);
    }
  }
  [data-theme="light"]{
    --accent:#33505a; --accent2:#5a7d80; --bg:#f2f2f7; --card:#fff; --card2:#fbfbfd;
    --text:#1c1c1e; --text2:#6c6c70; --text3:#a0a0a6; --sep:rgba(60,60,67,.18);
    --fill:rgba(120,120,128,.12); --lead:#345c4d; --support:#456680; --inform:#8c804d;
    --receive:#727278; --warn:#b5651d; --tabbar:rgba(249,249,251,.92);
  }
  [data-theme="dark"]{
    --accent:#5a8087; --accent2:#6e9398; --bg:#000; --card:#1c1c1e; --card2:#161618;
    --text:#fff; --text2:#9b9ba0; --text3:#6c6c70; --sep:rgba(84,84,88,.5);
    --fill:rgba(120,120,128,.2); --lead:#5a937c; --support:#6e93b8; --inform:#b5a76b;
    --receive:#9a9aa0; --warn:#d68a3f; --tabbar:rgba(22,22,24,.9);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  #app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

  /* Nav bar */
  .navbar{
    flex:0 0 auto; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display:flex;align-items:center;gap:8px;
    background:var(--tabbar);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--sep); position:relative;z-index:5;
  }
  .navbar .title{flex:1;text-align:center;font-size:17px;font-weight:600;}
  .navbtn{font-size:16px;color:var(--accent);min-width:40px;display:flex;align-items:center;gap:3px;}
  .navbtn.right{justify-content:flex-end;}
  .navbtn.back{font-weight:400;}

  /* Scroll area */
  .scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;}
  .scroll.flush{padding:0;}

  /* Tab bar */
  .tabbar{
    flex:0 0 auto;display:flex;justify-content:space-around;
    padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
    background:var(--tabbar);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--sep);z-index:5;
  }
  .tab{flex:1;text-align:center;color:var(--text3);font-size:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tab .ic{font-size:20px;line-height:1;}
  .tab.active{color:var(--accent);}

  /* Cards & components */
  .card{background:var(--card);border:.5px solid var(--sep);border-radius:14px;padding:16px;margin-bottom:12px;}
  .h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0 0 2px;}
  .sub{color:var(--text2);font-size:14px;}
  h2.sec{font-size:18px;font-weight:700;margin:18px 0 10px;}
  h3{font-size:16px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:6px;}
  h3 .ic{color:var(--accent);}
  .muted{color:var(--text2);font-size:13px;}
  .tiny{font-size:11px;color:var(--text3);}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:color-mix(in srgb,var(--accent) 16%, transparent);color:var(--accent);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:6px 10px;border-radius:20px;background:var(--fill);color:var(--text2);margin:0 6px 6px 0;}
  .chip.link{background:color-mix(in srgb,var(--accent) 15%, transparent);color:var(--accent);}
  .bullet{display:flex;gap:8px;font-size:14px;margin:6px 0;}
  .bullet .dot{color:var(--accent);}
  .row{display:flex;align-items:center;gap:12px;}
  .arrow{color:var(--text3);margin-left:auto;}
  .tap{cursor:pointer;}
  .tap:active{opacity:.6;}

  /* Big home cards */
  .bigcard{display:flex;align-items:center;gap:14px;background:var(--card);border:.5px solid var(--sep);border-radius:16px;padding:16px;margin-bottom:12px;width:100%;text-align:left;}
  .bigcard .glyph{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:0 0 auto;}
  .bigcard .t{font-weight:600;font-size:16px;}
  .bigcard .d{font-size:12px;color:var(--text2);margin-top:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .smallcard{background:var(--card);border:.5px solid var(--sep);border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:84px;justify-content:center;text-align:center;}
  .smallcard .ic{font-size:22px;color:var(--accent);}
  .smallcard .t{font-size:13px;font-weight:500;}
  .keyidea{background:var(--card);border:.5px solid var(--sep);border-radius:14px;padding:16px;}
  .caveat{display:flex;gap:8px;background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:10px;padding:12px;font-size:12px;color:var(--text2);}

  /* Timeline */
  .tl{display:flex;gap:14px;}
  .tl .col{display:flex;flex-direction:column;align-items:center;}
  .tl .num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .tl .line{width:2px;flex:1;background:color-mix(in srgb,var(--accent) 30%,transparent);min-height:18px;}
  .tl .body{padding-bottom:18px;flex:1;}
  .tl .body .t{font-weight:600;font-size:16px;}
  .tl .body .d{font-size:12.5px;color:var(--text2);margin-top:3px;}

  /* Filter chips row */
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .filters::-webkit-scrollbar{display:none;}
  .fchip{flex:0 0 auto;font-size:12px;font-weight:500;padding:7px 12px;border-radius:20px;background:var(--fill);color:var(--text);white-space:nowrap;}
  .fchip.on{background:var(--accent);color:#fff;}

  /* Search */
  .search{width:100%;padding:10px 12px;border-radius:10px;background:var(--fill);border:none;color:var(--text);font-size:15px;margin-bottom:12px;}
  .search::placeholder{color:var(--text3);}

  /* List rows */
  .listrow{background:var(--card);border:.5px solid var(--sep);border-radius:12px;padding:14px;margin-bottom:10px;}

  /* Matrix */
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .legend .it{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
  .ind{width:20px;height:20px;border-radius:5px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .mtable{overflow-x:auto;border-radius:12px;border:.5px solid var(--sep);background:var(--card);}
  table{border-collapse:collapse;font-size:11px;}
  th,td{padding:6px 5px;text-align:center;white-space:nowrap;}
  thead th{background:var(--fill);font-size:9px;font-weight:700;position:sticky;top:0;}
  td.org,th.org{text-align:left;font-weight:600;position:sticky;left:0;background:var(--card);min-width:78px;}
  thead th.org{background:var(--fill);}
  tbody tr{border-top:.5px solid var(--sep);}

  /* Forms */
  label.field{display:block;font-size:14px;font-weight:600;margin:14px 0 6px;}
  select,textarea,input[type=text]{width:100%;padding:11px 12px;border-radius:10px;background:var(--fill);border:none;color:var(--text);font-size:15px;font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  .btn{display:block;width:100%;background:var(--accent);color:#fff;font-weight:600;font-size:16px;padding:14px;border-radius:12px;text-align:center;margin-top:18px;}
  .btn.sec{background:var(--fill);color:var(--accent);}

  /* Quiz */
  .opt{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--sep);border-radius:10px;padding:14px;margin-bottom:10px;font-size:14px;}
  .opt.correct{background:color-mix(in srgb,#34a853 14%,transparent);border-color:#34a853;}
  .opt.wrong{background:color-mix(in srgb,#ea4335 14%,transparent);border-color:#ea4335;}
  .opt .mk{margin-left:auto;font-size:18px;}
  .progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:8px 0 16px;}
  .progress > i{display:block;height:100%;background:var(--accent);}

  /* Home overlay */
  .overlay{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;}
  .hidden{display:none !important;}
  .fadein{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .empty{text-align:center;color:var(--text2);padding:40px 20px;}
  .empty .ic{font-size:40px;color:var(--text3);}
  .demonote{font-size:11px;color:var(--text3);text-align:center;padding:6px 16px 0;}
</style>
</head>
<body>
<div id="app">
  <div class="navbar">
    <button class="navbtn back" id="backBtn" onclick="goBack()" style="visibility:hidden">‹ Back</button>
    <div class="title" id="navTitle">Process</div>
    <button class="navbtn right" id="themeBtn" onclick="toggleTheme()">◐</button>
  </div>
  <div class="scroll" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>

  <!-- Home overlay -->
  <div class="overlay" id="home"></div>
</div>

<script>
/* ============================ DATA ============================ */
const KEY_IDEA = "Capability development is an operational problem → portfolio → evidence loop — not a linear requirements-document-to-program pipeline.";
const CAVEAT = "Educational tool only. Organizations, roles, and authorities evolve. Verify current guidance against official source material before acting.";

const STEPS = [
 {n:1,title:"Strategic direction / operational problem",short:"Senior leaders and combatant commands frame the problem worth solving.",detail:"Everything starts with a validated operational problem and strategic direction. Department of War and Army senior leaders, combatant commands (CCMDs), and the Joint Staff set priorities and articulate the operational problems the force must solve. In the emerging model this is less about a single document and more about a shared understanding of what matters most. This problem-first framing is now statutory: under 10 U.S.C. §181, the JROC's mission includes compiling, refining, and prioritizing joint operational problems and recommending nonprescriptive solutions to them.",orgs:["DoW/DoD","Army Senior Leaders","CCMDs","Joint Staff","HQDA"],outputs:["Strategic guidance","Operational problem statement","Priorities","Joint Operational Problems","Army transformation priorities"],friction:["Problems stated as solutions ('we need X') rather than as problems","Unclear whether the problem is Army-only or Joint","Competing priorities with no clear ranking"],q:["What problem are we actually solving?","Who has validated that it matters?","Is this Army-only or Joint?"],next:[2,3]},
 {n:2,title:"Future-force framing",short:"Concepts describe how the future Army needs to fight.",detail:"The problem is placed in the context of the future operating environment. T2COM and the Futures and Concepts Command (FCC) — through its Directorate of Concepts (DoC) — translate strategic direction into concepts that describe how the future Army needs to fight. DoC informs forward-focused Army concepts to design the Army of 2040, produces the Future Warfighting Concepts, and represents the Army in developing Joint Warfighting Concepts.",orgs:["T2COM","FCC","Directorate of Concepts"],outputs:["Future operational environment assessment","Army concepts","Future Warfighting Concepts"],friction:["Assumptions left implicit and never tested","Concepts disconnected from what is technically or fiscally feasible"],q:["How does the future Army need to fight?","What assumptions are we making?","Which assumptions, if wrong, break the concept?"],next:[3]},
 {n:3,title:"Functional problem ownership",short:"An FCD takes ownership of the functional problem and gaps.",detail:"A Future Capability Directorate (FCD) takes primary ownership of the functional problem and frames it as capability gaps and learning demands. The nine FCDs — Aviation, C2, Cyber, Fires, Formation Based Layered Protection (FBLP), Intelligence, Maneuver, Medical, and Sustainment — are subordinate to FCC and drive functional transformation by informing concepts, requirements, and experimentation. Other FCDs are identified as supporting or affected. Clear ownership here prevents the most common failure mode downstream: no one accountable for the problem as a whole.",orgs:["FCDs","C2 FCD","Cyber FCD","Fires FCD","Intelligence FCD","Maneuver FCD","Aviation FCD","Sustainment FCD","Medical FCD","FBLP FCD"],outputs:["Functional modernization problems","Capability gaps","Learning demands","Concept-required capabilities"],friction:["Two FCDs each assume the other owns it","Cross-functional problems with no integrating owner"],q:["Which FCD owns the primary problem?","Which FCDs are supporting or affected?","Who integrates across the FCDs?"],next:[4,5]},
 {n:4,title:"DOTMLPF-P and proponent integration",short:"Determine what must change beyond equipment.",detail:"The Combined Arms Command (CAC), CAC TID, Centers of Excellence, and proponents examine the problem across all DOTMLPF-P domains. A surprising number of 'materiel gaps' are actually doctrine, organization, or training gaps. This step keeps the enterprise from buying equipment to solve a problem that a change in how we operate would solve faster and cheaper.",orgs:["CAC","CAC TID","Centers of Excellence","Proponents"],outputs:["Doctrine implications","Organization implications","Training implications","Materiel implications","Leadership/education implications","Personnel implications","Facilities implications","Policy implications"],friction:["Defaulting to a materiel solution before checking non-materiel options","Materiel fielded with no doctrine or training to employ it"],q:["Is this actually a materiel gap, or a DOTMLPF-P gap?","What must change besides equipment?","Who owns each non-materiel change?"],next:[5,8]},
 {n:5,title:"S&T / technical feasibility",short:"Assess whether a solution is technically possible and mature.",detail:"DEVCOM, ARL, MRDC, the C5ISR Center, industry, and innovation partners assess technical feasibility and technology maturity, and may build prototypes. This grounds the concept in what is actually buildable now versus what needs investment, and reveals what industry can already provide.",orgs:["DEVCOM","ARL","MRDC","C5ISR Center","Industry","Innovation partners"],outputs:["Technical feasibility assessment","Prototypes","S&T roadmap","Technology maturity insights"],friction:["Requirements written for technology that is not yet mature","Ignoring commercial solutions already on the market"],q:["Is the solution technically possible?","Is the technology mature?","What can industry already provide?"],next:[6]},
 {n:6,title:"Experimentation and Soldier feedback",short:"Put concepts and prototypes in front of Soldiers.",detail:"The Joint Modernization Command (JMC), Project Convergence, FCC experimentation, operational units, and the CTCs put concepts and prototypes in front of Soldiers and commanders. The purpose is learning, not validation theater: did the idea survive contact with reality?",orgs:["JMC","Project Convergence","FCC Experimentation","Operational units","CTCs"],outputs:["Learning results","User feedback","Prototype assessment","Military utility insights"],friction:["Experiments designed to confirm rather than to learn","Soldier feedback collected but never analyzed or acted on"],q:["What did Soldiers and commanders actually say?","Did the concept survive contact with reality?","What did we learn that we did not expect?"],next:[7]},
 {n:7,title:"Analysis and evidence",short:"Turn observations into rigorous evidence.",detail:"TDAC, CAA, ORSAs, ATEC, and analysts turn experimentation observations and data into rigorous evidence through operational analysis, modeling and simulation, and risk assessment. This is where assumptions are confirmed or disproven before the enterprise commits resources.",orgs:["TDAC","CAA","ORSAs","ATEC","Analysts"],outputs:["Operational analysis","Modeling and simulation","Formation effectiveness analysis","Performance data","Risk assessment"],friction:["Decisions made ahead of the analysis","Cherry-picking evidence that supports a preferred answer"],q:["What does the evidence actually show?","What assumptions were disproven?","How confident are we, and where is the risk?"],next:[8]},
 {n:8,title:"Requirements integration",short:"Translate evidence into justified, minimal requirements.",detail:"The FCC Futures Integration Directorate (FID), FCD requirements writers, HQDA G-8 Force Development, and CAC/proponents translate evidence into formal requirements. The discipline here is writing the minimum viable requirement that the evidence justifies — not a wish list. Under the JFRP (Jan 2026), the JROC no longer routinely validates Service-specific requirements — the Army validates its own through the AROC (per AR 71-9/ACIDS, pending post-JFRP update).",orgs:["FCC FID","FCD requirements writers","HQDA G-8 FD","CAC/Proponents"],outputs:["Validated gaps","CBAs / TBAs","CDDs","A-CDDs","ICDs","CONOPS","Requirements documentation"],friction:["Gold-plating requirements beyond what evidence supports","Requirements that no acquisition pathway can realistically deliver"],q:["What requirement is justified by evidence?","What is the minimum viable requirement?","Is this requirement testable and affordable?"],next:[9]},
 {n:9,title:"Resourcing and prioritization",short:"Decide what the Army can afford and what it displaces.",detail:"HQDA G-8, the PAE, the PEGs, the PPBC, the SRG, and ASA(FM&C) decide what fits in the Army Program and the FYDP. Every funded capability displaces something else; this step makes those trade-offs explicit.",orgs:["HQDA G-8","PAE","PEGs","PPBC","SRG","ASA(FM&C)"],outputs:["Army Program","FYDP alignment","Affordability analysis","Prioritization decisions"],friction:["Requirements approved with no resourcing path","Underestimating sustainment and lifecycle cost"],q:["Can the Army afford this?","What is displaced if this is funded?","Is the full lifecycle cost accounted for?"],next:[10]},
 {n:10,title:"Acquisition portfolio execution",short:"Select a pathway and execute with portfolio accountability.",detail:"ASA(ALT), PAEs, CPEs, PEOs, PMs, and contracting officials execute the acquisition. In the emerging model, portfolio accountability (PAEs/CPEs) sits alongside program execution (PEOs/PMs), and pathway selection is matched to the type of capability and how fast it must move. In November 2025 the system was redesignated the Warfighting Acquisition System (WAS), and the Army stood up six PAEs with PEOs transitioning to CPEs.",orgs:["ASA(ALT)","PAEs","CPEs","PEOs","PMs","Contracting officials"],outputs:["Acquisition strategy","Pathway selection","Contracts","Prototypes","Production plans"],friction:["Choosing a slow pathway for an urgent need (or vice versa)","Program execution without portfolio-level trade-off visibility"],q:["What acquisition pathway fits?","Who has portfolio accountability?","How does this fit the broader portfolio?"],next:[11]},
 {n:11,title:"Test and continuous evaluation",short:"Continuously test for effectiveness, suitability, and safety.",detail:"ATEC, PAE test integrators, and operational units test for operational effectiveness, suitability, and safety. In the emerging model, test is continuous and integrated with development rather than a single gate at the end, with Soldier-validated feedback throughout.",orgs:["ATEC","PAE test integrators","Operational units"],outputs:["Test data","Soldier-validated feedback","Safety releases","Operational effectiveness and suitability findings"],friction:["Test treated as a final gate instead of continuous","Discovering integration problems too late to fix cheaply"],q:["What must be tested before scaling?","What risks remain?","Is it effective, suitable, and safe for Soldiers?"],next:[12]},
 {n:12,title:"Fielding, sustainment, and formation integration",short:"Make sure units can absorb, train, maintain, and employ it.",detail:"AMC, ASC, the Army Service Component Commands (ASCCs), gaining units, CAC, T2COM, and the sustainment enterprise field the capability and integrate it into formations — with the training, doctrine, and sustainment needed to actually use it. A capability that units cannot absorb is not really fielded.",orgs:["AMC","ASC","ASCCs","Gaining units","CAC","T2COM","Sustainment enterprise"],outputs:["Fielding plans","Training","Doctrine updates","Sustainment plans","Formation integration"],friction:["Equipment fielded faster than units can absorb it","No sustainment plan, so capability degrades after fielding"],q:["Can units actually absorb, train, maintain, and employ this?","Is the sustainment tail funded?","What doctrine and training must change?"],next:[13]},
 {n:13,title:"Feedback loop",short:"Learn from the field and feed the next cycle.",detail:"Operational units, CTCs, exercises, and lessons-learned processes feed insights back to FCC, CAC, G-8, and ASA(ALT). This closes the loop: the field teaches the enterprise, concepts and requirements are refined, and the next iteration begins. The process is a loop, not a finish line.",orgs:["Operational units","CTCs","Exercises","Lessons learned","FCC","CAC","G-8","ASA(ALT)"],outputs:["Lessons learned","Updated concepts","Refined requirements","Modernization adjustments"],friction:["Lessons collected but never fed back into concepts or requirements","Treating fielding as the end of the story"],q:["What did the field teach us?","What must change in the next cycle?","Which assumptions from Step 2 turned out to be wrong?"],next:[1,2,3]}
];

const CATS = ["Concepts & Futures","Functional Problem Owners","Combined Arms & Proponents","Science & Technology","Experimentation","Analysis & Evidence","Requirements","Resourcing","Acquisition","Test & Evaluation","Sustainment & Fielding","Operational Force"];

const ORGS = [
 {id:"fcc",name:"Futures and Concepts Command",abbr:"FCC",cat:"Concepts & Futures",role:"Designs the future force by developing integrated concepts and requirements, informed by experimentation, and synchronized into T2COM and Army processes. Core functions: concepts, experimentation, requirements, integration — aimed at the Army needed 5 to 15 years out.",owns:["Future force design and concepts","Functional problem framing through its FCDs","Experimentation and requirements integration roles"],not:["Acquisition execution","Resourcing decisions","Operational test","Doctrine and training (CAC)"],rel:["CAC","DEVCOM","HQDA G-8","ASA(ALT)","JMC","TDAC"],out:["Concepts","Capability gaps","Requirements documentation","Experimentation campaigns"],when:"Early — whenever a future operational problem or capability gap is being framed.",steps:[2,3,6,8,13]},
 {id:"doc",name:"FCC Directorate of Concepts",abbr:"DoC",cat:"Concepts & Futures",role:"Informs forward-focused Army concepts to design the Army of 2040, produces the Future Warfighting Concepts, and represents the Army in Joint Warfighting Concept development.",owns:["Army warfighting concepts","Future operating environment framing"],not:["Requirements documents","Resourcing","Acquisition"],rel:["FCC","FCDs","CAC","T2COM"],out:["Future Warfighting Concepts","Operating environment assessments"],when:"At the very front, to frame the future-force context and surface assumptions.",steps:[2]},
 {id:"fid",name:"FCC Futures Integration Directorate",abbr:"FID",cat:"Requirements",role:"Identifies, synchronizes, and prioritizes requirements for FCC and Army processes; documents capability gaps, analyzes and integrates emerging materiel requirements, and synchronizes materiel solution resources.",owns:["Requirements integration across FCDs","Coherence of requirements documentation"],not:["Resourcing decisions","Acquisition execution"],rel:["FCDs","HQDA G-8 FD","CAC","TDAC"],out:["Integrated requirements documents","CDDs / A-CDDs / ICDs coordination"],when:"When evidence is mature enough to translate into formal requirements.",steps:[8]},

 {c:"Resourcing",p:"Where does HQDA G-8 most clearly enter the process?",o:["Writing concepts","Resourcing and prioritization (and helping validate requirements)","Running experiments","Operational test"],a:1,x:"HQDA G-8 is central to resourcing and prioritization, and G-8 Force Development helps validate and integrate requirements."},
 {c:"Roles",p:"What is the key difference between FCC/FCDs and PEOs/PMs?",o:["They are the same organization","FCC/FCDs frame problems and requirements; PEOs/PMs execute acquisition and deliver","FCC/FCDs run operational test","PEOs/PMs write the concepts"],a:1,x:"FCC/FCDs frame operational problems and requirements; PEOs/PMs (under ASA(ALT)) execute acquisition and deliver systems. The new model does not merge these roles."},
 {c:"Experimentation",p:"Soldiers need to try a prototype at scale to see if a concept works. Which organization most typically plans and runs that experimentation?",o:["JMC","ARL","ASA(FM&C)","ASARC"],a:0,x:"JMC plans and executes large-scale experimentation (including Project Convergence), putting concepts and prototypes in front of Soldiers."},
 {c:"S&T",p:"You need to know whether a proposed solution is even technically possible. Who do you engage?",o:["DEVCOM","G-8 PAE","ATEC","AMC"],a:0,x:"DEVCOM (with ARL, MRDC, and the C5ISR Center) assesses technical feasibility and technology maturity."},
 {c:"Test",p:"Who independently tests and evaluates a capability for effectiveness, suitability, and safety before scaling?",o:["FCC FID","ATEC","DoC","PEG"],a:1,x:"ATEC independently tests and evaluates capabilities and issues safety releases."},
 {c:"Process shape",p:"How is Army capability development best understood in the emerging model?",o:["A strictly linear requirements-to-program pipeline","An iterative operational problem → portfolio → evidence loop","A single document handed from one office to the next","Entirely owned by ASA(ALT)"],a:1,x:"It is best understood as an iterative, distributed loop — operational problem to portfolio to evidence — with feedback, not a linear pipeline."},
 {c:"Requirements",p:"When translating evidence into a formal requirement, what is the disciplined goal?",o:["Capture every desirable feature","Write the minimum viable requirement the evidence justifies","Skip requirements entirely","Let the PM define the requirement"],a:1,x:"The discipline is to write the minimum viable requirement justified by evidence — avoiding gold-plating that no pathway can deliver."},
 {c:"Fielding",p:"Before declaring a capability 'fielded,' what must be true of the gaining units?",o:["Nothing beyond delivery","They can absorb, train, maintain, and employ it","Only that the contract closed","Only that ATEC tested it"],a:1,x:"Fielding includes formation integration: units must be able to absorb, train, maintain, and employ the capability, with sustainment planned."}

function orgByAbbr(label){
  const l=label.toLowerCase();
  let o=ORGS.find(o=>o.abbr.toLowerCase()===l||o.name.toLowerCase()===l);
  if(o)return o;
  return ORGS.find(o=>l.includes(o.abbr.toLowerCase())||o.name.toLowerCase().includes(l));
}

/* ===================== RENDER ROUTER ===================== */
function render(){
  renderTabs();
  const top=stack[stack.length-1];
  $("#backBtn").style.visibility=stack.length>1?"visible":"hidden";
  const sc=$("#screen");sc.scrollTop=0;
  sc.className="scroll";
  let title="",html="";
  if(top.view==="root"){
    if(top.tab==="process"){title="Process";html=viewProcess();}
    else if(top.tab==="organizations"){title="Organizations";html=viewOrgs();}
    else if(top.tab==="matrix"){title="Matrix";html=viewMatrix();}
    else if(top.tab==="build"){title="Build a Path";html=viewBuild();}
    else if(top.tab==="glossary"){title="Glossary";html=viewGlossary();}
  } else if(top.view==="step"){title="Step "+top.param;html=viewStep(top.param);}
  else if(top.view==="org"){const o=ORGS.find(o=>o.id===top.param);title=o.abbr;html=viewOrg(o);}
  else if(top.view==="term"){title="Glossary";html=viewTerm(top.param);}
  else if(top.view==="result"){title="Recommended Path";html=lastResult||"";}
  else if(top.view==="quiz"){title="Training Quiz";html=viewQuiz();}
  else if(top.view==="notes"){title="Saved Notes";html=viewNotes();}
  $("#navTitle").textContent=title;
  sc.innerHTML=`<div class="fadein">${html}</div>`;
  if(top.view==="root"&&top.tab==="organizations")wireOrgSearch();
  if(top.view==="root"&&top.tab==="glossary")wireGlossSearch();
}

/* ===================== PROCESS ===================== */
function viewProcess(){
  let h=`<div class="card"><h3>The Capability-Development Loop</h3><div class="muted">${esc(KEY_IDEA)}</div><div class="muted" style="margin-top:6px">Tap any step. The process is iterative — the last step feeds back into the first.</div></div>`;
  STEPS.forEach((s,i)=>{
    const last=i===STEPS.length-1;
    h+=`<div class="tap" onclick="push('step',${s.n})"><div class="tl">
      <div class="col"><div class="num">${s.n}</div>${last?'':'<div class="line"></div>'}</div>
      <div class="body"><div class="t">${esc(s.title)}</div><div class="d">${esc(s.short)}</div></div>
      <div class="arrow" style="align-self:center">›</div></div></div>`;
  });
  h+=`<div class="muted" style="display:flex;gap:8px;margin-top:4px"><span style="color:var(--accent)">↻</span> Feedback returns to Steps 1–3 — the loop continues.</div>`;
  return h;
}
function viewStep(n){
  const s=STEPS.find(x=>x.n==n);
  const chips=s.orgs.map(l=>{const o=orgByAbbr(l);return o?`<span class="chip link tap" onclick="push('org','${o.id}')">${esc(l)} ↗</span>`:`<span class="chip">${esc(l)}</span>`;}).join("");
  let nx=s.next.map(nn=>{const t=STEPS.find(x=>x.n===nn);return `<div class="row tap" onclick="push('step',${nn})" style="padding:6px 0"><span style="color:var(--accent);font-size:14px">${nn}. ${esc(t.title)}</span><span class="arrow">›</span></div>`;}).join("");
  return `<span class="badge">Step ${s.n} of 13</span>
    <h1 style="font-size:22px;margin:10px 0 8px">${esc(s.title)}</h1>
    <p style="font-size:15px;line-height:1.5">${esc(s.detail)}</p>
    <div class="card"><h3><span class="ic">▦</span> Primary organizations</h3><div>${chips}</div></div>
    <div class="card"><h3><span class="ic">▣</span> Key outputs / artifacts</h3>${bullets(s.outputs)}</div>
    <div class="card"><h3><span class="ic">⚠︎</span> Common friction points</h3>${bullets(s.friction)}</div>
    <div class="card"><h3><span class="ic">?</span> Questions a staff officer should ask</h3>${bullets(s.q)}</div>
    <div class="card"><h3><span class="ic">↳</span> Typically flows to</h3>${nx}</div>
    <button class="btn sec" onclick="addNote('Process Step','Step ${s.n}: ${esc(s.title)}')">＋ Add note</button>`;
}

let lastResult="";
function sel(id,opts,val){return `<select id="${id}">`+opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join("")+`</select>`;}
function viewBuild(){
  const tri=["Yes","No","Unsure"];

   <button class="btn" onclick="generate()">✦ Generate recommended path</button><div style="height:10px"></div>`;

function dedupe(a){return [...new Set(a)];}
function generate(){
  const a={
    prob:$("#b_prob").value.trim(),wf:$("#b_wf").value,sol:$("#b_sol").value,
    joint:$("#b_joint").value,tech:$("#b_tech").value,exist:$("#b_exist").value,
    exp:$("#b_exp").value,dot:$("#b_dot").value,fund:$("#b_fund").value,urg:$("#b_urg").value
  };
  const fcdMap={"Command & Control":"C2 FCD","Movement & Maneuver":"Maneuver FCD","Intelligence":"Intelligence FCD","Fires":"Fires FCD","Sustainment":"Sustainment FCD","Protection":"FBLP FCD","Information / Cyber":"Cyber FCD"};
  const fcd=fcdMap[a.wf]||"the relevant FCD";
  let orgs=[],actions=[],arts=[],risks=[],rhythm=[];
  orgs.push(fcd,"FCC Directorate of Concepts (DoC)");
  actions.push(`Frame the operational problem with ${fcd} and DoC — state it as a problem, not a solution.`);
  arts.push("Operational problem statement / capability gap");
  if(a.sol!=="Materiel"||a.dot!=="No"){orgs.push("CAC TID (DOTMLPF-P integration)");actions.push("Engage CAC TID to test whether this is a materiel or DOTMLPF-P gap, and identify non-materiel changes.");arts.push("DOTMLPF-P implications assessment");}
  if(a.sol!=="Non-materiel"){
    const st=(a.wf.includes("Cyber")||a.wf.includes("Command"))?"DEVCOM C5ISR Center":"DEVCOM";
    orgs.push(st);actions.push(`Ask ${st} for a technical feasibility and technology maturity assessment.`);arts.push("Technical feasibility assessment");
    if(a.tech==="No")risks.push("Technology may not be mature — writing requirements too early risks an undeliverable program.");
    if(a.exist==="Yes")actions.push("Check commercial / existing prototype options before assuming new development is required.");
  }
  if(a.exp!=="No"){orgs.push("JMC (experimentation)");actions.push("Coordinate with JMC to experiment with Soldiers and capture honest feedback.");arts.push("Experimentation / Soldier feedback results");}
  else risks.push("Skipping experimentation risks committing resources to an unvalidated concept.");
  orgs.push("TDAC (analysis)");arts.push("Operational analysis / evidence");
  orgs.push("FCC FID","HQDA G-8 Force Development");arts.push("Requirements documentation (e.g., ICD / CDD / A-CDD)");
  if(a.joint==="Yes"){orgs.push("Joint Staff (JFRP engagement)");actions.push("Engage the Joint Staff early — Joint interoperability shapes the JFRP path (JROC focuses on joint operational problems; Service-specific validation stays with the Army via the AROC).");risks.push("Joint validation can extend timelines and add coordination overhead.");}
  if(a.fund!=="No"){orgs.push("HQDA G-8 / PAE (resourcing)");arts.push("Affordability analysis / POM input");risks.push("A validated requirement with no resourcing path stalls — plan the POM/PPBE engagement.");}
  if(a.sol!=="Non-materiel"){orgs.push("ASA(ALT) / PEO-PM","ATEC (test)","AMC (fielding & sustainment)");arts.push("Acquisition strategy and pathway selection","Test & evaluation and fielding plans");}
  actions.push("Plan the feedback loop now — define how units, CTCs, and lessons-learned will refine the next cycle.");
  arts.push("Lessons-learned / feedback plan");
  if(a.urg==="Urgent"){rhythm=["Stand up a small cross-org working group meeting weekly.","Compress experimentation and analysis into focused sprints.","Consider faster pathways (e.g., MTA rapid prototyping / fielding, Software Acquisition Pathway) — depending on guidance.","Brief decision-makers on a short, recurring cycle to keep momentum."];risks.push("Speed pressure can tempt the team to skip evidence — keep at least minimal experimentation and analysis.");}
  else rhythm=["Establish a monthly cross-organization sync across the involved organizations.","Sequence experimentation → analysis → requirements deliberately, with decision gates.","Align requirements maturity to the POM/PPBE calendar.","Hold a quarterly portfolio review with the PAE once acquisition is engaged."];
  if(a.dot==="Yes")risks.push("Non-materiel changes (doctrine, training, organization) often lag materiel — assign owners early.");
  // narrative
  let nar=`For this problem, start with ${fcd} and the Directorate of Concepts (DoC) to frame the operational problem`;
  if(a.sol!=="Materiel"||a.dot!=="No")nar+=", involve CAC TID for DOTMLPF-P implications";
  if(a.sol!=="Non-materiel"){const st=(a.wf.includes("Cyber")||a.wf.includes("Command"))?"DEVCOM C5ISR":"DEVCOM";nar+=`, engage ${st} for technical feasibility`;}
  if(a.exp!=="No")nar+=", coordinate with JMC for experimentation";
  nar+=", use TDAC for analysis, and involve FCC FID / HQDA G-8 FD before drafting formal requirements";
  if(a.fund!=="No")nar+=", then work resourcing through HQDA G-8 / the PAE";
  if(a.sol!=="Non-materiel")nar+=", with ASA(ALT)/PEO-PM for acquisition, ATEC for test, and AMC for fielding and sustainment";
  nar+=a.urg==="Urgent"?". Given urgency, compress the cycle and consider faster acquisition pathways, depending on guidance.":". Run this deliberately, aligned to the POM/PPBE calendar.";
  nar+=" Remember: this is a loop — plan the feedback path now.";
  orgs=dedupe(orgs);actions=dedupe(actions).slice(0,5);arts=dedupe(arts);risks=dedupe(risks);
  const numbered=actions.map((x,i)=>`<div class="bullet"><span class="dot" style="font-weight:700">${i+1}.</span><span>${esc(x)}</span></div>`).join("");
  lastResult=`<div class="card"><h3><span class="ic">🗺</span> Recommended approach</h3><div style="font-size:14px;line-height:1.5">${esc(nar)}</div></div>
    <div class="card"><h3><span class="ic">▦</span> Organizations to involve</h3>${bullets(orgs)}</div>
    <div class="card"><h3><span class="ic">№</span> First five staff actions</h3>${numbered}</div>
    <div class="card"><h3><span class="ic">▣</span> Likely artifacts</h3>${bullets(arts)}</div>
    <div class="card"><h3><span class="ic">⚠︎</span> Key risks</h3>${bullets(risks)}</div>
    <div class="card"><h3><span class="ic">📅</span> Recommended battle rhythm</h3>${bullets(rhythm)}</div>
    <div class="muted">Reminder: capability development is a loop. Plan the feedback path from the start. Verify current authorities and guidance.</div>
    <button class="btn sec" onclick="addNote('Capability Path','Path: ${esc((a.prob||a.wf).slice(0,50))}')">＋ Save as note</button>`;
  push("result");
}

/* ===================== GLOSSARY ===================== */
let glossQuery="";
function viewGlossary(){
  let list=GLOSS.filter(g=>!glossQuery||(g.t+" "+g.d).toLowerCase().includes(glossQuery)).sort((a,b)=>a.t.localeCompare(b.t));
  let rows=list.map(g=>`<div class="listrow tap" onclick="push('term','${encodeURIComponent(g.t)}')"><strong>${esc(g.t)}</strong><div class="muted" style="margin-top:3px">${esc(g.d)}</div></div>`).join("")||`<div class="empty"><div class="ic">🔍</div><div>No terms found.</div></div>`;
  return `<input class="search" id="glossSearch" placeholder="Search terms" value="${esc(glossQuery)}">${rows}`;
}
function wireGlossSearch(){const el=$("#glossSearch");if(el)el.oninput=e=>{glossQuery=e.target.value.toLowerCase();const pos=el.selectionStart;render();const n=$("#glossSearch");if(n){n.focus();n.setSelectionRange(pos,pos);}};}
function viewTerm(enc){
  const t=decodeURIComponent(enc);const g=GLOSS.find(x=>x.t===t);
  return `<h1 style="font-size:26px;margin:6px 0 14px">${esc(g.t)}</h1>
   <div class="card"><h3><span class="ic">≡</span> Plain-English definition</h3><div style="font-size:15px;line-height:1.5">${esc(g.d)}</div></div>
   <div class="card"><h3><span class="ic">★</span> Why it matters</h3><div style="font-size:14px;line-height:1.5">${esc(g.w)}</div></div>
   <div class="card"><h3><span class="ic">❝</span> Example</h3><div class="muted" style="font-style:italic;font-size:14px">“${esc(g.e)}”</div></div>
   <button class="btn sec" onclick="addNote('Glossary Term','Glossary: ${esc(g.t)}')">＋ Add note</button>`;
}

/* ===================== QUIZ ===================== */
let qi=0,qsel=null,qans=false,qscore=0,qdone=false;
function viewQuiz(){
  if(qdone){
    const ratio=qscore/QUIZ.length;
    const msg=ratio>=0.9?"Excellent — you have a strong grasp of the ecosystem.":ratio>=0.7?"Solid. Review the steps you missed and try again.":"Good start. Explore the Process and Organizations screens, then retry.";
    return `<div class="empty"><div style="font-size:54px">🏅</div><h2>You scored ${qscore} of ${QUIZ.length}</h2><div class="muted">${esc(msg)}</div></div><button class="btn" onclick="qreset()">↺ Try again</button>`;
  }
  const q=QUIZ[qi];
  let opts=q.o.map((o,i)=>{
    let cls="opt",mk="";
    if(qans){if(i===q.a){cls+=" correct";mk='<span class="mk">✓</span>';}else if(i===qsel){cls+=" wrong";mk='<span class="mk">✕</span>';}}
    return `<div class="${cls}" onclick="qpick(${i})"><span>${esc(o)}</span>${mk}</div>`;
  }).join("");
  let fb=qans?`<div class="card"><h3 style="color:${qsel===q.a?'#34a853':'var(--warn)'}">${qsel===q.a?'✓ Correct':'ℹ︎ Not quite'}</h3><div style="font-size:14px;line-height:1.5">${esc(q.x)}</div></div>
    <button class="btn" onclick="qnext()">${qi===QUIZ.length-1?'See results':'Next question'}</button>`:"";
  return `<div class="row"><span class="badge">${esc(q.c)}</span><span class="tiny" style="margin-left:auto">Question ${qi+1} of ${QUIZ.length}</span></div>
   <div class="progress"><i style="width:${(qi/QUIZ.length)*100}%"></i></div>
   <h2 style="font-size:18px;line-height:1.4">${esc(q.p)}</h2>${opts}${fb}`;
}
function qpick(i){if(qans)return;qsel=i;qans=true;if(i===QUIZ[qi].a)qscore++;render();}
function qnext(){if(qi===QUIZ.length-1){qdone=true;}else{qi++;qsel=null;qans=false;}render();}
function qreset(){qi=0;qsel=null;qans=false;qscore=0;qdone=false;render();}

/* ===================== NOTES ===================== */
function getNotes(){try{return JSON.parse(localStorage.getItem("cf_notes")||"[]");}catch(e){return [];}}
function saveNotes(n){localStorage.setItem("cf_notes",JSON.stringify(n));}
function addNote(kind,label){
  const body=prompt(`New note · ${label}\n\nType your note:`);
  if(body===null)return;
  const notes=getNotes();
  notes.unshift({id:Date.now(),kind,label,body,date:new Date().toLocaleDateString()});
  saveNotes(notes);
  alert("Saved to Notes.");
}
function delNote(id){if(!confirm("Delete this note?"))return;saveNotes(getNotes().filter(n=>n.id!==id));render();}
function viewNotes(){
  const notes=getNotes();
  if(!notes.length)return `<div class="empty"><div class="ic">🗒</div><div>No notes yet.</div><div class="muted" style="margin-top:6px">Save notes from any process step, organization, glossary term, or capability path. They stay on this device.</div></div>`;
  return notes.map(n=>`<div class="listrow"><div class="row"><strong>${esc(n.label)}</strong><span class="badge" style="margin-left:auto">${esc(n.kind)}</span></div>
    <div style="font-size:14px;margin-top:6px;white-space:pre-wrap">${esc(n.body)}</div>
    <div class="row" style="margin-top:8px"><span class="tiny">${esc(n.date)}</span><button class="navbtn right" style="margin-left:auto;color:#ea4335" onclick="delNote(${n.id})">Delete</button></div></div>`).join("");
}

/* ===================== INIT ===================== */
render();
showHome();
</script>
</body>
</html>
